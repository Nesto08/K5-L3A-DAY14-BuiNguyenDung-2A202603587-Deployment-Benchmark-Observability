services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "${PORT:-8000}:${PORT:-8000}"

    env_file:
      - .env

    environment:
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      PORT: ${PORT:-8000}

    depends_on:
      redis:
        condition: service_healthy

    restart: unless-stopped

    stop_grace_period: 8s

  redis:
    image: redis:7-alpine

    command:
      - redis-server
      - --appendonly
      - "yes"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

    restart: unless-stopped

volumes:
  redis_data: